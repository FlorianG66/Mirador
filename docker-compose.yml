# Dev : PostgreSQL local. En production, la config est injectée au déploiement (jamais dans Git).
services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mirador}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-mirador}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mirador} -d ${POSTGRES_DB:-mirador}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
