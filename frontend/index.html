<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- PWA (sous-phase 6c-iii-b) : l'application doit être installable pour que
         les notifications Web Push soient acceptées sur bureau et mobile. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="theme-color" content="#0b0f19" />
    <title>Mirador</title>
    <script>
      // Amorçage du thème avant le premier rendu : évite un flash de thème
      // inversé. Même logique (et même clé) que le hook useTheme ; le thème
      // système ne sert qu'à la première visite.
      (function () {
        try {
          var stored = localStorage.getItem('mirador-theme')
          var prefersDark =
            stored !== 'light' &&
            (stored === 'dark' ||
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (prefersDark) document.documentElement.classList.add('dark')
        } catch (error) {
          // Stockage indisponible (navigation privée) : on reste en clair.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
