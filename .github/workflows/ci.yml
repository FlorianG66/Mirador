# CI : lint, types, tests, détection de secrets.
# Le job `frontend` couvre la SPA (lint, types, tests, build) ; les tests e2e
# Playwright n'y tournent pas encore (ils visent le navigateur Edge du poste de
# dev — v. docs/DECISIONS.md).
name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Détection de secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tout l'historique : un secret reste compromis même supprimé
      - name: Installer gitleaks (version épinglée)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scanner tout l'historique
        run: gitleaks git . --redact --verbose

  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Installer les dépendances (épinglées)
        run: python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Format (ruff)
        run: ruff format --check .
      - name: Types (mypy strict)
        run: mypy
      - name: Tests + couverture (seuil 80 %)
        # Les tests lancent PostgreSQL via pgserver (binaires fournis par la wheel).
        run: pytest -q --cov=app

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer les dépendances (épinglées)
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Types (tsc)
        run: npm run typecheck
      - name: Tests (Vitest)
        run: npm test
      - name: Build (vite)
        run: npm run build
