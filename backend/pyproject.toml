[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mirador-backend"
version = "0.1.0"
description = "API Mirador — dashboard d'entreprise"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.142.3",
    "pydantic==2.14.1",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.1.4",
    "alembic==1.20.0",
    "asyncpg==0.32.0",
    "uvicorn==0.54.0",
    # Auth phase 2b : hachage de mot de passe (Argon2id) et validation d'e-mail (EmailStr).
    "argon2-cffi==25.1.0",
    "email-validator==2.3.0",
    # Connexion Google (phase 2e) : échange du code OIDC et userinfo (déjà utilisé en test).
    "httpx==0.28.1",
    # Dépendance transitive de httpx, épinglée pour garder le correctif de sécurité
    # PYSEC-2026-4320 (corrigé en 2026.10.19) et une CI d'audit verte.
    "certifi==2026.10.19",
    # Web Push (phase 6c-iii-b) : protocole VAPID + chiffrement des messages.
    "pywebpush==2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.10",
    "mypy==2.4.0",
    "pgserver==0.1.4",
    # Audit des dépendances en CI (AGENTS.md §5).
    "pip-audit==2.10.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]

# `pywebpush` n'expose pas de marqueur `py.typed` : on l'importe sans stubs
# (l'appel est isolé dans `WebPushSender`, jamais utilisé en test).
[[tool.mypy.overrides]]
module = ["pywebpush.*"]
ignore_missing_imports = true
